global-styling:
  version: 5.0.39
  js: 
    js/bootstrap.tla.min.js: {}
  css:
    component:
      css/style.css: {}
      css/flat_design_tokens.css: {}
      css/flat_browser_overrides.css: {}
  dependencies:
    - core/jquery
    - core/drupal

# Front page collection cards; attached from templates/layout/page--front.html.twig.
# The `theme` group sorts after `component`, so it overrides the legacy
# .category rules in style.css.
front-page:
  version: 1.0.0
  css:
    theme:
      css/front_page.css: {}

# Footer of the archive sites; attached from
# templates/layout/archive-footer.html.twig. Used by this theme and the themes
# built on it. The `theme` group overrides the fixed footer height in style.css.
archive-footer:
  version: 1.0.0
  css:
    theme:
      css/archive_footer.css: {}
